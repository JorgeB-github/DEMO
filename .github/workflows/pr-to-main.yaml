name: PR to main - Validate (delta)

on:
  pull_request:
    branches:
      - main

jobs:
  validate-delta:
    runs-on: ubuntu-latest
    container: tnascimento013/latam_salesforcedx_industries_orgdevmodebuilds:latest
    environment: AgentForce
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4.1.7
        with:
          fetch-depth: 0

      - name: Mark workspace as safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Extract JWT private key
        run: echo "${{ secrets.JWT_AGENTFORCE }}" > AgentForce.key

      - name: Install sfdx-git-delta
        run: |
          export HOME=/root
          yes | sf plugins install sfdx-git-delta || sf plugins install sfdx-git-delta

      - name: Authenticate (JWT)
        run: |
          export HOME=/root
          sf org login jwt \
            --client-id "${{ vars.CLIENT_ID }}" \
            --jwt-key-file AgentForce.key \
            --username "${{ vars.USERNAME }}" \
            --instance-url "${{ vars.INSTANCE_URL }}" \
            --alias ci --set-default

      - name: Validate delta (check-only, no activation)
        run: |
          export HOME=/root
          chmod +x scripts/ci/agent-delta.sh
          FROM_REF="${{ github.event.pull_request.base.sha }}" \
          TO_REF="${{ github.event.pull_request.head.sha }}" \
          MODE="validate" \
          TARGET_ORG="ci" \
          bash scripts/ci/agent-delta.sh
