name: DEMO Pipline

on:
  pull_request:
    branches:
      - main

# Jobs to be executed
jobs:
  demo-deploy-on-pr:
    runs-on: ubuntu-latest
    container: tnascimento013/latam_salesforcedx_industries_orgdevmodebuilds:latest
    environment: AgentForce
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4.1.7

      - name: Extracting private key
        run: 'echo "${{ secrets.JWT_AgentForce }}" > AgentForce.key'

      - name: Running the build & deploy
        run: |
          export HOME=/root
          sf builds deploy --buildfile manifest/buildfile.json --client-id ${{ vars.CLIENT_ID }} --instance-url ${{ vars.INSTANCE_URL }} --username ${{ vars.USERNAME }} --jwt-key-file AgentForce.key


