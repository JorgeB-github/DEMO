name: Merge to main - Deploy & Activate (delta)

on:
  push:
    branches:
      - main

jobs:
  deploy-delta:
    runs-on: ubuntu-latest
    container: tnascimento013/latam_salesforcedx_industries_orgdevmodebuilds:latest
    environment: AgentForce
    permissions:
      contents: write
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4.1.7
        with:
          fetch-depth: 0

      - name: Mark workspace as safe for git
        run: |
          export HOME=/root
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config --global --add safe.directory '*'

      - name: Extract JWT private key
        run: echo "${{ secrets.JWT_AGENTFORCE }}" > AgentForce.key

      - name: Install / update CLI plugins
        run: |
          export HOME=/root
          mkdir -p "$HOME/.config/sf" "$HOME/.config/sfdx"
          echo '["sfdx-git-delta"]' | tee "$HOME/.config/sf/unsignedPluginAllowList.json" "$HOME/.config/sfdx/unsignedPluginAllowList.json" >/dev/null
          sf plugins inspect sfdx-git-delta >/dev/null 2>&1 || sf plugins install sfdx-git-delta < /dev/null
          # Agent (authoring-bundle) commands are recent; ensure the plugin is current.
          sf plugins install @salesforce/plugin-agent@latest < /dev/null

      - name: Authenticate (JWT)
        run: |
          export HOME=/root
          sf org login jwt \
            --client-id "${{ vars.CLIENT_ID }}" \
            --jwt-key-file AgentForce.key \
            --username "${{ vars.USERNAME }}" \
            --instance-url "${{ vars.INSTANCE_URL }}" \
            --alias ci --set-default

      - name: Deploy delta + publish & activate agent
        run: |
          export HOME=/root
          chmod +x scripts/ci/agent-delta.sh
          # PR number from the merge commit message (e.g. "Merge pull request #3 ...").
          PR_NUMBER="$(git log -1 --pretty=%B | grep -oE '#[0-9]+' | head -n1 | tr -d '#' || true)"
          echo "PR_NUMBER=${PR_NUMBER}"
          FROM_REF="${{ github.event.before }}" \
          TO_REF="${{ github.sha }}" \
          MODE="deploy" \
          TARGET_ORG="ci" \
          RELEASE_NOTES="docs/release-notes.csv" \
          PR_NUMBER="${PR_NUMBER}" \
          bash scripts/ci/agent-delta.sh

      - name: Commit release notes
        run: |
          export HOME=/root
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          git add docs/release-notes.csv 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No release-notes changes to commit."
          else
            git commit -m "docs: release notes [skip ci]"
            git push origin HEAD:main
          fi
