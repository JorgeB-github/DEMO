ame: Validação Pull Request QA Atendimento

on:
  pull_request:
    branches:
      - qa-atendimento

# Jobs to be executed
jobs:
  build-deploy:
    runs-on:
      group: gps-github-test-runners
    container: tnascimento013/latam_salesforcedx_industries_orgdevmodebuilds:latest
    environment: build-atendimento
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4.1.7

      - name: Extracting private key
        run: 'echo "${{ secrets.JWT_KEY_NONPROD }}" > server.key'

      - name: Running the build & deploy
        run: |
          export HOME=/root
          sf builds deploy --buildfile manifest/buildfile.json --client-id ${{ vars.CLIENT_ID }} --instance-url ${{ vars.INSTANCE_URL }} --username ${{ vars.USERNAME }} --jwt-key-file server.key

  dry-run-QA:
    runs-on:
      group: gps-github-test-runners
    container: tnascimento013/latam_salesforcedx_industries_orgdevmodebuilds:latest
    environment: qa-atendimento
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4.1.7

      - name: Extracting private key
        run: 'echo "${{ secrets.JWT_KEY_NONPROD }}" > server.key'

      - name: Authenticate org 
        run: |
          export HOME=/root
          sf org login jwt \
            --client-id ${{ vars.CLIENT_ID }} \
            --username  ${{ vars.USERNAME }} \
            --jwt-key-file server.key \
            --instance-url ${{ vars.INSTANCE_URL }} \
            --alias qa-atendimento \
            --set-default

      - name: Running dry-run deploy 
        run: |
          export HOME=/root
          sf project deploy start \
            --target-org qa-atendimento \
            --manifest manifest/package-deploy.xml \
            --dry-run
