name: Manually deploy

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git reference from where the checkout is happening
        type: string
        required: true
      environment:
        description: Environment that is going to be used
        type: string
        required: true

run-name: Deploy ref ${{ inputs.ref }} to env ${{ inputs.environment }}

# Jobs to be executed
jobs:
  build-deploy:
    name: Deploy to ${{ inputs.environment }}
    runs-on:
      group: gps-github-test-runners
    container: tnascimento013/latam_salesforcedx_industries_orgdevmodebuilds:latest
    environment: ${{ inputs.environment }}
    steps:
      - name: "Checkout source code"
        uses: actions/checkout@v4.1.7
        with:
          ref: ${{ inputs.ref }}

      - name: Extracting private key
        run: 'echo "${{ secrets.JWT_DataPrev }}" > dataprev.key'

      - name: Running the build & deploy
        run: |
          export HOME=/root       
          export NODE_OPTIONS="--max_old_space_size=4096"
          sf builds deploy --buildfile manifest/buildfile.json --client-id ${{ vars.CLIENT_ID }} --instance-url ${{ vars.INSTANCE_URL }} --username ${{ vars.USERNAME }} --jwt-key-file dataprev.key
